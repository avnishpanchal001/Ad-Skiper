<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>adskiper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 250px;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #FFFFFF;
      color: #0F172A;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-box {
      width: 28px;
      height: 28px;
      background: #FFE600;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(15, 23, 42, 0.15);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    .brand-name {
      font-size: 16px;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.5px;
    }
    .version-tag {
      font-size: 10px;
      font-weight: 700;
      color: #475569;
      background: #F1F5F9;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .toggle-btn {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 12px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      transition: all 0.15s ease;
    }
    .toggle-btn.on {
      background: #10B981;
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(16, 185, 129, 0.25);
    }
    .toggle-btn.off {
      background: #F1F5F9;
      color: #64748B;
    }

    .stats-card {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      margin-bottom: 12px;
    }
    .stats-label {
      font-size: 10px;
      font-weight: 700;
      color: #64748B;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stats-num {
      font-size: 32px;
      font-weight: 800;
      color: #0F172A;
      line-height: 1.1;
      margin: 2px 0 4px 0;
      font-variant-numeric: tabular-nums;
    }
    .stats-desc {
      font-size: 10px;
      font-weight: 600;
      color: #059669;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: #64748B;
      padding-top: 4px;
    }
    .reset-link {
      background: none;
      border: none;
      color: #64748B;
      cursor: pointer;
      font-size: 10px;
      text-decoration: underline;
    }
    .reset-link:hover {
      color: #0F172A;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-box">
        <svg width="18" height="18" viewBox="0 0 14 12" style="image-rendering: pixelated;">
          <rect x="1" y="2" width="1" height="8" fill="#000000" />
          <rect x="2" y="2" width="1" height="8" fill="#000000" />
          <rect x="3" y="3" width="1" height="6" fill="#000000" />
          <rect x="4" y="3" width="1" height="6" fill="#000000" />
          <rect x="5" y="4" width="1" height="4" fill="#000000" />
          <rect x="6" y="4" width="1" height="4" fill="#000000" />
          <rect x="7" y="5" width="1" height="2" fill="#000000" />
          <rect x="8" y="5" width="1" height="2" fill="#000000" />
          <rect x="10" y="2" width="1.5" height="8" fill="#000000" />
          <rect x="11.5" y="2" width="1" height="8" fill="#000000" />
        </svg>
      </div>
      <div class="brand-name">adskiper</div>
    </div>
    <span class="version-tag">v2.3</span>
  </div>

  <button id="toggleBtn" class="toggle-btn on">
    <span id="statusDot">●</span>
    <span id="statusText">ADSKIPER ACTIVE</span>
  </button>

  <div class="stats-card">
    <div class="stats-label">Ads Skipped &amp; Erased</div>
    <div class="stats-num" id="countDisplay">0</div>
    <div class="stats-desc" id="statusDesc">✓ 100% Ad-Free with adskiper</div>
  </div>

  <div class="footer">
    <span>Zero Buffering</span>
    <button class="reset-link" id="resetBtn">Reset</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
